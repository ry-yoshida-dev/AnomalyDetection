name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run basedpyright src tests
      - run: uv run pytest
  minimum-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The NumPy floors per Python version match pyproject.toml.
      matrix:
        include:
          - python-version: "3.12"
            numpy-version: "2.2.*"
          - python-version: "3.13"
            numpy-version: "2.2.*"
          - python-version: "3.14"
            numpy-version: "2.3.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: >-
          uv run --isolated --no-project --python ${{ matrix.python-version }}
          --with numpy==${{ matrix.numpy-version }}
          --with scikit-learn==1.8.*
          --with pytest
          --with-editable .
          pytest
