[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detection"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Decide whether feature vectors are normal or anomalous with supervised, unsupervised, and zero-shot methods behind a common processor API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = [
    "data-scaler @ git+https://github.com/ry-yoshida-dev/DataScaler.git@fff3316a8cb5ddc689a5194f7183688f787da7c7",
    # Newer Python versions raise the floors to the first releases with wheels for them.
    "numpy>=2.2; python_version < '3.14'",
    "numpy>=2.3.2; python_version == '3.14'",
    "numpy>=2.5.2; python_version >= '3.15'",
    "scikit-learn>=1.8; python_version < '3.15'",
    "scikit-learn>=1.9.1; python_version >= '3.15'",
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/AnomalyDetection"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/AnomalyDetection/issues"

[tool.uv]
# Earlier versions ignore a relative exclude-newer.
required-version = ">=0.9.17"
exclude-newer = "7 days"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
stubPath = "stubs"
exclude = ["stubs", ".venv"]

[tool.mypy]
mypy_path = "stubs:src"
files = ["src", "tests"]
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "basedpyright",
    "mypy",
    "pytest>=9",
    "ruff",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["stubs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
